target-version = "py310"
line-length = 120
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "E501",  # long lines are left to review; the formatter is not enforced
    "B008",  # FastAPI dependencies are declared as argument defaults
    "S101",  # assert is used in tests
]

[lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311"]
"app/seed/**" = ["S105", "S106", "S311"]
