# Parity environment: PostgreSQL, Redis, MinIO, API, worker, nginx + static UI.
# Build the UI first (cd frontend && npm run build), then: docker compose up --build
# Not exercised in CI yet; the Ubuntu host deploy (deploy.ps1) does not use Docker.
x-backend-env: &backend-env
  ENVIRONMENT: development
  DEMO_MODE: "true"
  DATABASE_URL: postgresql+psycopg://bdp:bdp@db:5432/bdp
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: bdp
  S3_ACCESS_KEY: bdp-minio
  S3_SECRET_KEY: bdp-minio-secret
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY (base64, 32 bytes)}
  MAIL_BACKEND: file
  MAIL_OUTBOX_DIR: /data/outbox
  PUBLIC_BASE_URL: http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: bdp, POSTGRES_USER: bdp, POSTGRES_PASSWORD: bdp }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bdp"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: bdp-minio, MINIO_ROOT_PASSWORD: bdp-minio-secret }
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "sleep 3; mc alias set m http://minio:9000 bdp-minio bdp-minio-secret && mc mb -p m/bdp"]
  api:
    build: ./backend
    environment: *backend-env
    command: sh -c "python -m app.cli dev-setup && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    depends_on: { db: { condition: service_healthy }, minio-init: { condition: service_completed_successfully } }
    volumes: [outbox:/data/outbox]
  worker:
    build: ./backend
    environment: *backend-env
    command: python -m app.worker
    depends_on: [api]
    volumes: [outbox:/data/outbox]
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./frontend/out:/usr/share/nginx/html:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes: { pgdata: {}, miniodata: {}, outbox: {} }
