# Included in every location: nginx replaces inherited add_header directives in
# any location that declares its own, so each location includes this snippet.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Next.js static export bootstraps with inline scripts, hence 'unsafe-inline' for scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Ignored by browsers over plain HTTP; effective once TLS is in place.
add_header Strict-Transport-Security "max-age=31536000" always;
