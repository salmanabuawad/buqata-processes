# tender.kortexd.com — static Next.js export + FastAPI on 127.0.0.1:8097.
# One-time install (see DEPLOY_SERVER.md); afterwards `certbot --nginx -d tender.kortexd.com` adds TLS.
# Rate-limit zones are http-level and uniquely named for this site.
limit_req_zone $binary_remote_addr zone=bdp_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=bdp_auth:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tender.kortexd.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }

    root /opt/buqata-processes/frontend/dist;
    index index.html;
    client_max_body_size 110m;

    # Login and registration: slow enough to make guessing impractical.
    location ~ ^/api/v1/(auth/login|auth/demo-login|suppliers/register)$ {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        limit_req zone=bdp_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        limit_req zone=bdp_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

}
