# Rate-limit zones are http-level and uniquely named for this site.
limit_req_zone $binary_remote_addr zone=bdp_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=bdp_auth:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tender.kortexd.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://tender.kortexd.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tender.kortexd.com;
    server_tokens off;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/buqata-processes;
    index index.html;
    client_max_body_size 110m;

    # Login and registration: slow enough to make guessing impractical.
    location ~ ^/api/v1/(auth/login|auth/demo-login|suppliers/register)$ {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        limit_req zone=bdp_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        limit_req zone=bdp_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/buqata-processes-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

}
